name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    uses: ./.github/workflows/verify.yml
  required:
    name: CI required
    if: always()
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks
        env:
          RESULT: ${{ needs.verify.result }}
        run: test "$RESULT" = success
